name: Foundation regression tests
on:
  workflow_call:
permissions:
  contents: read
jobs:
  modern:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: decryptus/sonicprobe
          ref: 23fd66928a2f4fc6129468c7b7a237f88243f8d2
          path: dependencies/sonicprobe
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: decryptus/dwho
          ref: 8bf98047c0bfc4d250b6c0a24b6ece191582f7d0
          path: dependencies/dwho
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . dependencies/sonicprobe dependencies/dwho mock
      - name: Test the installed package outside the checkout
        run: |
          cd "$(mktemp -d)"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['2.7.18', '3.5', '3.6', '3.7', '3.8', '3.9']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: decryptus/sonicprobe
          ref: 23fd66928a2f4fc6129468c7b7a237f88243f8d2
          path: dependencies/sonicprobe
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: decryptus/dwho
          ref: 8bf98047c0bfc4d250b6c0a24b6ece191582f7d0
          path: dependencies/dwho
          persist-credentials: false
      - name: Install and test with the legacy interpreter
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro"
          python:${{ matrix.python }}
          bash /src/.github/scripts/test-legacy.sh
