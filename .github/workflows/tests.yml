name: Foundation regression tests
on:
  workflow_call:
permissions:
  contents: read
jobs:
  consumers:
    name: Consumer compatibility (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    services:
      redis:
        image: redis:7.2.6-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: decryptus/dwho
          ref: e9bbe111856c29d6f365f5ad4e2cae158322c1d2
          path: consumers/dwho
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: decryptus/auton
          ref: c6f9256710f067cd24a084ed8ecd9a175be97301
          path: consumers/auton
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: decryptus/covenant
          ref: 59b72ef4ef7987465c840e39215badc87f52eefa
          path: consumers/covenant
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/checkout@v4
        with:
          repository: decryptus/monit-docker
          ref: 001157a163054ede47637a32c8dd74a8cdd525a6
          path: consumers/monit-docker
          persist-credentials: false
      - name: Install candidate HTTPdis with pinned consumer sources
        run: |
          python -m pip install . ./consumers/dwho "sonicprobe==0.3.53" mock packaging jmespath prometheus-client
          AUTON_PACKAGE=autond python -m pip install ./consumers/auton
          python -m pip install --no-deps ./consumers/covenant
          python -m pip install ./consumers/monit-docker
      - name: Verify the candidate and exercise consumers outside the HTTPdis checkout
        env:
          DWHO_REDIS_TEST_URL: redis://127.0.0.1:6379/0
        run: |
          cd "$(mktemp -d)"
          python - "$GITHUB_WORKSPACE" <<'PY'
          import pathlib, httpdis, sys
          installed = pathlib.Path(httpdis.__file__).resolve().parent
          candidate = pathlib.Path(sys.argv[1]) / 'httpdis'
          assert installed != candidate.resolve()
          for relative in ('httpdis.py', 'config.py', 'ext/httpdis_json.py'):
              assert (installed / relative).read_bytes() == (candidate / relative).read_bytes(), relative
          PY
          python -m unittest discover -s "$GITHUB_WORKSPACE/consumers/dwho/tests" -v
          python -m unittest discover -s "$GITHUB_WORKSPACE/consumers/auton/tests" -v
          python -m unittest discover -s "$GITHUB_WORKSPACE/consumers/covenant/tests" -v
          python -m unittest discover -s "$GITHUB_WORKSPACE/consumers/monit-docker/tests" -v
  modern:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . "sonicprobe==0.3.52" "dwho==0.3.61" mock
      - name: Test the installed package outside the checkout
        run: |
          cd "$(mktemp -d)"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['2.7.18', '3.5', '3.6', '3.7', '3.8', '3.9']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install and test with the legacy interpreter
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro"
          python:${{ matrix.python }}
          bash /src/.github/scripts/test-legacy.sh

