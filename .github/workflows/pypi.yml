name: Test and publish to PyPI
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: python -m pip install -r docs/requirements.txt
      - run: python -m sphinx -W -b html docs docs/_build/html
      - uses: actions/upload-artifact@v7
        with:
          name: html-documentation
          path: docs/_build/html/
          if-no-files-found: error
  tests:
    uses: ./.github/workflows/tests.yml
  build:
    needs: [tests, documentation]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install build twine PyYAML
      - run: python .github/scripts/check-test-collection.py --runner unittest .github/tests
      - run: python -m unittest discover -s .github/tests -v
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python .github/scripts/check-distributions.py
      - name: Test the wheel and source distribution
        run: |
          python -m pip install dist/*.whl "sonicprobe==0.3.66" "dwho==0.3.61" mock
          cd "$(mktemp -d)"
          python "$GITHUB_WORKSPACE/.github/scripts/check-test-collection.py" --runner unittest "$GITHUB_WORKSPACE/tests"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
          python -m pip install --force-reinstall --no-deps "$GITHUB_WORKSPACE"/dist/*.tar.gz
          python "$GITHUB_WORKSPACE/.github/scripts/check-test-collection.py" --runner unittest "$GITHUB_WORKSPACE/tests"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        run: bash .github/scripts/select-release.sh
      - name: Create the validated version tag
        if: steps.release.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
  publish:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
  github-release:
    timeout-minutes: 10
    needs: [release, publish]
    if: >-
      always() && needs.release.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish or recover the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: bash .github/scripts/publish-github-release.sh
